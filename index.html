<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Client Intake</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intake">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="ios-navbar">
    <div class="nav-title">Client Intake Form</div>
    <button type="button" class="nav-btn-action" id="clearBtn">Clear</button>
  </header>

  <main class="ios-content">
    <form id="intakeForm">
      
      <div class="ios-group-title">Client Information</div>
      <div class="ios-list-group">
        <div class="ios-input-row">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Jane Doe" required autocomplete="off">
        </div>
        <div class="ios-input-row">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane.doe@example.com" required autocomplete="off">
        </div>
      </div>

      <div class="ios-group-title">Authorization & Signature</div>
      <div class="ios-card">
        <canvas id="signaturePad"></canvas>
        <div class="canvas-hint">Sign above using your finger or stylus</div>
      </div>

      <div class="ios-action-wrapper">
        <button type="submit" class="ios-btn-primary" id="submitBtn">Submit & Upload</button>
      </div>

    </form>
  </main>

  <div id="toast" class="ios-toast"></div>

  <script src="app.js"></script>
</body>
</html>
