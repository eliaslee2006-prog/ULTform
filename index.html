<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SharePoint Intake System</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>
  <!-- Floating Toast Notifications -->
  <div id="toast-container"></div>

  <div id="app-container">
    <!-- Main Workspace -->
    <main id="editor-tab" class="tab-content active">
      <div class="toolbar glass-panel">
        <label class="action-btn">
          Load Template
          <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
        </label>
        <button class="action-btn" id="addTextBtn">+ Text</button>
        <button class="action-btn" id="openSigBtn">+ Signature</button>
        
        <div class="pagination">
          <button class="icon-btn" id="prevPage">&lt;</button>
          <span id="pageIndicator">0 / 0</span>
          <button class="icon-btn" id="nextPage">&gt;</button>
        </div>

        <select id="exportFormat" class="action-select">
          <option value="pdf">PDF (Flattened)</option>
          <option value="png">PNG Image</option>
        </select>
        
        <button class="action-btn export-btn" id="exportBtn">Export / Share</button>
        <button class="action-btn sync-btn" id="syncBtn">Sync SharePoint</button>
      </div>

      <div class="viewport-wrapper">
        <div id="a4Container" class="a4-viewport">
          <canvas id="pdfCanvas"></canvas>
          <div id="interactiveOverlay"></div>
        </div>
      </div>
    </main>

    <!-- Signature Modal -->
    <div id="sigModal" class="modal-overlay">
      <div class="modal-card glass-panel">
        <h3>Add Smooth Signature</h3>
        <div class="canvas-wrapper">
          <canvas id="modalSigCanvas"></canvas>
        </div>
        <div class="modal-actions">
          <button class="action-btn" id="clearSigBtn">Clear</button>
          <button class="action-btn" id="cancelSigBtn">Cancel</button>
          <button class="action-btn export-btn" id="saveSigBtn">Apply Signature</button>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="glass-hud">
      <div class="hud-tabs">
        <button class="hud-btn active" data-tab="editor-tab">Editor</button>
        <button class="hud-btn" data-tab="storage-tab">Storage</button>
        <button class="hud-btn" data-tab="settings-tab">Settings</button>
      </div>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
